name: Update live channels

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [curated.json, scripts/**]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # What the last run learnt (streams being tracked, today's quota): kept in the Actions cache, not committed
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Look up live streams
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('.state/state.json') != ''
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish channels.json if it changed
        run: |
          if git diff --quiet -- channels.json && git ls-files --error-unmatch channels.json >/dev/null 2>&1; then
            echo "No change to publish"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git commit -m "Live channels updated"
          git pull --rebase --quiet
          git push
